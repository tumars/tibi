<style>
/* 复习页专属样式 */
.rv { max-width: 720px; margin: 0 auto; padding: 22px 32px 0; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
/* 复审：动作区固定在底部（显示答案 / 评分永远在同一个位置），卡片只负责题目与答案 */
.rvfoot { position: sticky; bottom: 0; margin-top: auto; padding: 18px 0 20px; background: linear-gradient(to bottom, transparent, var(--surface) 30%); display: flex; flex-direction: column; gap: 10px; }
.rvfoot .keys { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
.rvfoot .keys .kbd { margin: 0 2px; }
.rvfoot .actions { gap: 8px; }
.rvfoot .reveal { height: 50px; border-radius: 16px; }
.rvfoot .linkbtn { align-self: center; }
.rvbar { display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.segs { flex: 1; display: flex; gap: 3px; height: 6px; }
.segs i { flex: 1; border-radius: 99px; background: var(--line); transition: background .3s; }
.segs i.cur { background: var(--ink-3); }
.segs i.r1 { background: var(--hard); } .segs i.r2 { background: var(--mid); } .segs i.r3 { background: var(--ink); } .segs i.r4 { background: var(--accent); }
.card { position: relative; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.03); padding: 24px 30px 26px; display: flex; flex-direction: column; gap: 20px; background: var(--surface); }
.chead { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; }
.ctype { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--sunken); color: var(--ink-2); font-weight: 500; }
.chead .sp { flex: 1; }
.chead .ibtn { width: 28px; height: 28px; }
.prompt { font-size: 13.5px; color: var(--ink-2); }
.sentence { font-family: var(--f-read); font-size: 23px; line-height: 1.65; color: var(--ink); }
.sentence .tw { border-radius: 3px; padding: 0 1px; }
.tw.s0 { background: linear-gradient(to bottom, transparent 34%, var(--hl-new) 34%, var(--hl-new) 90%, transparent 90%); }
.tw.s1 { background: linear-gradient(to bottom, transparent 34%, var(--hl-1) 34%, var(--hl-1) 90%, transparent 90%); }
.tw.s2 { background: linear-gradient(to bottom, transparent 34%, var(--hl-2) 34%, var(--hl-2) 90%, transparent 90%); }
.blank { display: inline-block; min-width: 4.5em; border: 0; border-bottom: 2px solid var(--ink-3); background: transparent; font: inherit; color: var(--accent); text-align: center; padding: 0 4px; outline: none; border-radius: 0; transition: border-color .2s; }
.blank:focus { border-bottom-color: var(--accent); }
.blank.ok { border-bottom-color: var(--ok); color: var(--ok); } .blank.bad { border-bottom-color: var(--hard); color: var(--hard); text-decoration: line-through; }
.fix { color: var(--ok); font-weight: 700; margin-left: 6px; }
.hint { font-size: 13px; color: var(--ink-3); }
.hint b { color: var(--ink-2); font-weight: 500; }
.bigzh { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.spellrow { display: flex; gap: 10px; align-items: center; }
.spellin { flex: 1; height: 52px; border: 0; border-radius: 16px; background: var(--sunken); padding: 0 18px; font-family: var(--f-read); font-size: 22px; color: var(--ink); outline: none; }
.spellin:focus { box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--surface); }
.spellin.ok { box-shadow: inset 0 0 0 1.5px var(--ok); } .spellin.bad { box-shadow: inset 0 0 0 1.5px var(--hard); }
.play { width: 64px; height: 64px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; flex: none; transition: transform .15s; }
.play:hover { transform: scale(1.05); }
.play.small { width: 44px; height: 44px; background: var(--sunken); color: var(--ink); }
.listen { display: flex; align-items: center; gap: 16px; }
.wave { display: flex; gap: 3px; align-items: center; height: 28px; }
.wave i { width: 3px; border-radius: 3px; background: var(--line-2); height: 30%; }
.wave.on i { background: var(--accent); animation: wv .9s ease-in-out infinite; }
.wave.on i:nth-child(2n) { animation-delay: .15s; } .wave.on i:nth-child(3n) { animation-delay: .3s; }
@keyframes wv { 0%, 100% { height: 25%; } 50% { height: 100%; } }
.produce { width: 100%; min-height: 96px; border: 0; border-radius: 16px; background: var(--sunken); padding: 14px 16px; font-family: var(--f-read); font-size: 17px; line-height: 1.6; color: var(--ink); resize: vertical; outline: none; }
.produce:focus { box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--surface); }
.answer { display: flex; flex-direction: column; gap: 12px; padding-top: 18px; border-top: 1px dashed var(--line-2); }
.answer .hwrow { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.answer .hw { font-size: 26px; }
.answer .ipa { font-family: var(--f-read); font-style: italic; color: var(--ink-2); }
.answer .ctxzh { font-size: 13.5px; color: var(--ink-2); line-height: 1.7; }
.answer .src { font-size: 12px; color: var(--ink-3); }
.verdict { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--hard); } .verdict.mid { color: var(--mid); }
.actions { display: flex; flex-direction: column; gap: 10px; }
.reveal { height: 52px; border-radius: 16px; background: var(--ink); color: var(--surface); font-size: 14.5px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px; }
.reveal:hover { opacity: .9; }
.reveal .kbd { color: inherit; opacity: .6; box-shadow: inset 0 0 0 1px currentColor; }
.rates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 11px 6px 10px; border-radius: 16px; background: var(--sunken); transition: background .15s, box-shadow .15s, transform .15s; }
.rate:hover { transform: translateY(-1px); }
.rate b { font-size: 14px; font-weight: 600; }
.rate span { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.rate[data-r="1"] b { color: var(--hard); } .rate[data-r="2"] b { color: var(--mid); } .rate[data-r="4"] b { color: var(--accent); }
.rate.sug { box-shadow: inset 0 0 0 1.5px var(--ink); background: var(--surface); }
.rate .k { font-family: var(--f-mono); font-size: 10px; color: var(--ink-3); }
.stagechg { position: absolute; top: 22px; right: 26px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface); box-shadow: 0 0 0 1px var(--line-2); }
/* 完成页 */
.done { display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; padding-top: 8px; }
.done .ill { width: 220px; height: 220px; margin-bottom: -10px; }
.done .ill img { display: block; width: 100%; height: 100%; }
.done h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
.done .sub { color: var(--ink-2); font-size: 14px; margin-top: -10px; }
.kpis3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.kpis3 div { padding: 16px; border-radius: 16px; background: var(--sunken); display: flex; flex-direction: column; gap: 4px; text-align: left; }
.kpis3 b { font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpis3 span { font-size: 12px; color: var(--ink-3); }
.kpis3.two { grid-template-columns: repeat(2, 1fr); }
.dbar { width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.dbar .bar { display: flex; gap: 3px; height: 10px; }
.dbar .bar i { border-radius: 4px; }
.dbar .lab { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.dbar .lab i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
.chg { width: 100%; text-align: left; display: flex; flex-direction: column; }
.chg h5 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--ink-3); }
.chg div { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
.chg div:last-child { border-bottom: 0; }
.chg b { font-family: var(--f-read); font-weight: 700; font-size: 15.5px; }
.chg .arrow { display: inline-flex; align-items: center; gap: 6px; }
.done .row { justify-content: center; }
.qlist a { display: flex; align-items: center; gap: 8px; }
.qlist .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); flex: none; }
.qlist .dot.r1 { background: var(--hard); } .qlist .dot.r2 { background: var(--mid); } .qlist .dot.r3 { background: var(--ink); } .qlist .dot.r4 { background: var(--accent); }
.qlist a.cur { color: var(--ink); font-weight: 500; }
/* 2026-10-30 复习改版（G1–G8，参考词光 Word Atlas） */
.rvbar .linkbtn { white-space: nowrap; }
.top .crumb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rvseg { flex: none; display: inline-flex; padding: 2px; border-radius: 8px; background: var(--sunken); gap: 2px; }
.rvseg button { white-space: nowrap; height: 26px; padding: 0 12px; border-radius: 6px; font-size: 12.5px; color: var(--ink-2); }
.rvseg button.on { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: 0 0 0 1px var(--line); }
.rvseg.wrap { flex-wrap: wrap; }
.segs i.ri { background: var(--line-2); } .segs i.ro { background: color-mix(in srgb, var(--ok) 55%, transparent); } .segs i.rx { background: color-mix(in srgb, var(--hard) 45%, transparent); }
.segs i.rt { flex: .6; }
.rtag { color: var(--mid); font-weight: 500; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line-2); text-align: left; font-size: 14px; transition: background .15s, box-shadow .15s, opacity .2s; }
.opt:hover:not([disabled]) { background: var(--hover); }
.opt .kbd { flex: none; }
.opt.ok { box-shadow: inset 0 0 0 1.5px var(--ok); background: color-mix(in srgb, var(--ok) 8%, transparent); }
.opt.bad { box-shadow: inset 0 0 0 1.5px var(--hard); background: color-mix(in srgb, var(--hard) 7%, transparent); }
.opt.dim { opacity: .45; }
.opt .from { margin-left: auto; font-size: 11.5px; color: var(--ink-3); text-align: right; }
.footrow { display: flex; justify-content: center; gap: 20px; }
.footnote { text-align: center; font-size: 12.5px; color: var(--ink-3); padding: 6px 0; }
.gline { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.gtag { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 6px; background: var(--sunken); color: var(--ink-2); }
.gtag.r1 { color: var(--hard); } .gtag.r2 { color: var(--mid); } .gtag.r3 { color: var(--ink); } .gtag.r4 { color: var(--accent); }
.gline .linkbtn { margin-left: auto; }
.introbody { display: flex; flex-direction: column; gap: 12px; }
.ihw { display: flex; align-items: baseline; gap: 12px; font-family: var(--f-read); font-size: 34px; font-weight: 700; letter-spacing: -.01em; }
.ihw .ipa { font-size: 15px; font-weight: 400; font-style: italic; color: var(--ink-2); }
.introcard { box-shadow: inset 0 0 0 1px var(--line), inset 3px 0 0 var(--hl-new); }
.resume { flex-direction: row; align-items: center; gap: 18px; }
.resume h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.resume p { margin: 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.6; }
.rfox { width: 72px; height: 72px; flex: none; }
.nextup { width: 100%; display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 12px; background: var(--accent-wash); text-align: left; }
.nextup div { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.nextup b { font-size: 14px; color: var(--accent); font-weight: 600; } .nextup span { font-size: 12.5px; color: var(--ink-2); }
.chg div.miss b { color: var(--hard); }
.qtag { font-size: 10.5px; color: var(--ink-3); margin-left: 6px; padding: 0 5px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line-2); }
.story { margin: 10px 0; padding: 14px 16px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-family: var(--f-read); font-size: 15px; line-height: 1.7; }
.story h4 { margin: 0 0 6px; font-size: 17px; }
.story p { margin: 0 0 10px; }
.smeta { font-family: var(--f-ui); font-size: 11.5px; color: var(--ink-3); }
.phead h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; } .phead p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.pmodes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.pmode { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 16px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); text-align: left; transition: box-shadow .15s, background .15s; }
.pmode:hover { background: var(--hover); }
.pmode.on { box-shadow: inset 0 0 0 1.5px var(--ink); }
.pmode .pic { font-size: 18px; color: var(--accent); } .pmode b { font-size: 14px; } .pmode small { font-size: 12px; color: var(--ink-3); }
.prow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pdiff .miss { color: var(--hard); text-decoration: underline wavy; text-underline-offset: 4px; }
.opts.two { grid-template-columns: 1fr 1fr; }
</style>

      <div class="story"><h4>The Night Shift at the Museum</h4>${paras}<div class="smeta">Tibi 写的 · 约 160 词 · 生词率约 2% · 放进书架时会标为"生成内容"</div></div>
      <div class="row" style="justify-content:flex-start"><button class="btn pri sm" id="toShelf">放进书架，开始读</button><button class="btn sm" id="another">换一篇</button></div></div>`;
    anim(m.lastElementChild, { opacity: [0, 1], y: [8, 0] }, SPRING);
    $('#toShelf').onclick = () => toast('原型：短文已放进书架（类型：一般 · 标签：Tibi 写的），在阅读器里打开', () => {}, '打开');
    $('#another').onclick = () => toast('原型：Tibi 会换一个题材重写，仍然用到这些词');
  }, 1400);
}

/* ============ 练习（G8：不计分，成绩单独记录） ============ */
const PSRC = ['最近复习', '错词', '难词', '《Understanding Ownership in Rust》'];
const PMODES = { dict: ['听写原句', '听你读过的句子，写下整句', '♪'], conf: ['易混词辨析', '在句子里选对的那个', '⇄'] };
const DICT = ['Delays affect fewer than one in ten journeys.', 'Newcomers often find themselves grappling with the borrow checker.', 'The upshot is memory safety without the runtime overhead.', 'The borrow checker verifies that no reference outlives its value.', 'Cities are turning to sponge design as floods intensify.'];
const CONF = [
  { s: 'Delays {} fewer than one in ten journeys.', a: 'affect', b: 'effect', why: '这里需要谓语动词。affect 是动词"影响"；effect 多作名词"效果"。' },
  { s: 'The new policy had little {} on prices.', a: 'effect', b: 'affect', why: 'have an effect on 是固定搭配，这里要名词。' },
  { s: 'The {} reason for the delay was the weather.', a: 'principal', b: 'principle', why: 'principal 作形容词是"主要的"；principle 是名词"原则"。' },
  { s: 'The wine is a perfect {} to the meal.', a: 'complement', b: 'compliment', why: 'complement 是"相配之物、补充"；compliment 是"称赞"。' },
  { s: 'Be careful not to {} your keys again.', a: 'lose', b: 'loose', why: 'lose 是动词"丢失"；loose 是形容词"松的"。' },
];
let pm = 'dict', psrc = 0, prun = null;
const words = s => s.toLowerCase().replace(/[^a-z' ]/g, ' ').split(/\s+/).filter(Boolean);
function lcsMatch(t, u) {   // 目标句的每个词是否被写出来（按最长公共子序列对齐）
  const L = Array.from({ length: t.length + 1 }, () => new Array(u.length + 1).fill(0));
  for (let i = t.length - 1; i >= 0; i--) for (let j = u.length - 1; j >= 0; j--) L[i][j] = t[i] === u[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const hit = new Array(t.length).fill(false); let i = 0, j = 0;
  while (i < t.length && j < u.length) { if (t[i] === u[j]) { hit[i] = true; i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  return hit;
}
function renderPractice(dir) {
  renderQueue();
  if (!prun) {
    $('#rv').innerHTML = `<div class="phead"><h2>练习</h2><p>不计分，不影响复习排期。</p></div>
      <div class="pmodes">${Object.entries(PMODES).map(([k, v]) => `<button class="pmode${k === pm ? ' on' : ''}" data-m="${k}"><span class="pic">${v[2]}</span><b>${v[0]}</b><small>${v[1]}</small></button>`).join('')}</div>
      <div class="prow"><span class="lbl-i">${pm === 'conf' ? '词来自' : '句子来自'}</span><div class="rvseg wrap">${PSRC.map((s, i) => `<button class="${i === psrc ? 'on' : ''}" data-s="${i}">${esc(s)}</button>`).join('')}</div></div>
      <div class="kpis3 two"><div><b>92%</b><span>听写准确率（最近 5 轮）</span></div><div><b>4</b><span>完成轮次</span></div></div>
      <div class="rvfoot"><div class="actions"><button class="reveal" id="pStart">开始一轮 · 5 ${pm === 'conf' ? '题' : '句'} <span class="kbd">Enter</span></button></div></div>`;
    document.querySelectorAll('.pmode').forEach(b => b.onclick = () => { pm = b.dataset.m; renderPractice(); });
    document.querySelectorAll('.prow button').forEach(b => b.onclick = () => { psrc = +b.dataset.s; renderPractice(); });
    $('#pStart').onclick = startPractice;
    if (dir === 'enter') anim(document.querySelectorAll('#rv > *'), { opacity: [0, 1], y: [8, 0] }, { duration: 0.35, ease: EASE, delay: stag(0.05) });
    return;
  }
  const r = prun, it = r.items[r.i];
  if (!it) { practiceDone(); return; }
  let body = '', foot = '';
  const head = `<div class="chead"><span class="ctype">${PMODES[r.m][2]} ${PMODES[r.m][0]}</span><span>不计分</span><span class="sp"></span><span>${r.i + 1} / ${r.items.length}</span></div>`;
  if (r.m === 'dict') {
    body = `<div class="prompt">听句子，写下整句（标点和大小写不算错）</div><div class="listen"><button class="play" id="playS"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg></button><button class="play small" id="playSlow">0.7×</button><div class="wave" id="wave">${'<i></i>'.repeat(14)}</div></div>`;
    if (!r.shown) { body += `<textarea class="produce" id="pIn" placeholder="写下听到的句子"></textarea>`; foot = `<button class="reveal" id="pCheck">检查 <span class="kbd">Enter</span></button><div class="footrow"><button class="linkbtn" id="pGive">听不出来，看原句</button></div>`; }
    else { const t = it.split(' '), hit = lcsMatch(words(it), words(r.val)); let k = 0;
      body += `<div class="sentence pdiff">${t.map(w => { const ok = words(w).length ? hit[k++] : true; return ok ? esc(w) : `<span class="miss">${esc(w)}</span>`; }).join(' ')}</div><div class="hint">你写的：${esc(r.val || '（空）')}</div>`;
      foot = `<div class="gline"><span class="gtag">${r.acc}%</span><span>写对了 ${r.acc}% 的词${r.acc === 100 ? '，一个不差' : '；红色是漏掉或写错的'}</span></div><button class="reveal" id="pNext">继续 <span class="kbd">Enter</span></button>`; }
  } else {
    const [x, y] = hash(it.s) % 2 ? [it.a, it.b] : [it.b, it.a];
    body = `<div class="prompt">选出放在空里正确的那个词</div><div class="sentence">${esc(it.s).replace('{}', r.shown ? `<span class="tw s0">${it.a}</span>` : '<span style="border-bottom:2px solid var(--ink-3);padding:0 2.2em"></span>')}</div>
      <div class="opts two">${[x, y].map((o, k) => `<button class="opt${r.shown ? (o === it.a ? ' ok' : o === r.val ? ' bad' : ' dim') : ''}" data-o="${o}" ${r.shown ? 'disabled' : ''}><span class="kbd">${k + 1}</span><span style="font-family:var(--f-read);font-size:16px">${o}</span></button>`).join('')}</div>`;
    if (r.shown) { body += `<div class="answer"><div class="gloss">${esc(it.why)}</div></div>`; foot = `<button class="reveal" id="pNext">继续 <span class="kbd">Enter</span></button>`; }
    else foot = '<div class="footnote">按 <span class="kbd">1</span> 或 <span class="kbd">2</span> 选择</div>';
  }
  $('#rv').innerHTML = `<div class="rvbar"><div class="segs">${r.items.map((_, i) => `<i class="${i < r.i ? (r.score[i] >= 80 ? 'ro' : 'rx') : i === r.i ? 'cur' : ''}"></i>`).join('')}</div><span>练习 · 不计分</span><button class="linkbtn" id="pQuit">结束练习</button></div>
    <section class="card" id="card">${head}${body}</section><div class="rvfoot"><div class="actions">${foot}</div></div>`;
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('#playS', () => speak(it, 0.95)); on('#playSlow', () => speak(it, 0.7));
  on('#pQuit', () => { prun = null; renderPractice('enter'); });
  on('#pCheck', pCheck); on('#pGive', () => { $('#pIn').value = ''; pCheck(); }); on('#pNext', pNext);
  document.querySelectorAll('.opts.two .opt').forEach(b => b.onclick = () => pConf(b.dataset.o));
  const inp = $('#pIn');
  if (inp && !r.shown) setTimeout(() => inp.focus(), 60);
  if (r.m === 'dict' && !r.shown && dir === 'next') setTimeout(() => speak(it, 0.95), 400);
  if (dir === 'next') anim($('#card'), { opacity: [0, 1], x: [24, 0] }, { type: 'spring', bounce: 0.15, duration: 0.45 });
}
function startPractice() {
  const items = pm === 'conf' ? CONF.slice() : DICT.slice();
  prun = { m: pm, items, i: 0, shown: false, val: '', acc: 0, score: [], t0: Date.now() };
  renderPractice('next');
}
function pCheck() {
  const r = prun, it = r.items[r.i]; r.val = ($('#pIn') || {}).value || '';
  const hit = lcsMatch(words(it), words(r.val)); r.acc = Math.round(hit.filter(Boolean).length / hit.length * 100);
  r.score[r.i] = r.acc; r.shown = true; renderPractice();
}
function pConf(o) { const r = prun; if (r.shown) return; r.val = o; r.shown = true; r.score[r.i] = o === r.items[r.i].a ? 100 : 0; renderPractice(); }
function pNext() { const r = prun; r.i++; r.shown = false; r.val = ''; renderPractice('next'); }
function practiceDone() {
  const r = prun, acc = Math.round(r.score.reduce((a, b) => a + b, 0) / r.score.length), secs = Math.round((Date.now() - r.t0) / 1000);
  $('#rv').innerHTML = `<div class="rvbar"><div class="segs">${r.items.map((_, i) => `<i class="${r.score[i] >= 80 ? 'ro' : 'rx'}"></i>`).join('')}</div><span>练习完成</span></div>
    <section class="card resume"><div class="rfox" id="rfox"></div><div><h3>${PMODES[r.m][0]} · 准确率 ${acc}%</h3><p>用时 ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}。</p></div></section>
    <div class="rvfoot"><div class="actions"><button class="reveal" id="pAgain">再来一轮 <span class="kbd">Enter</span></button><div class="footrow"><button class="linkbtn" id="pBack">回到练习</button></div></div></div>`;
  if (window.Fox) Fox.mount($('#rfox'), { state: acc >= 80 ? 'happy' : 'idle', size: 72 });
  $('#pAgain').onclick = startPractice; $('#pBack').onclick = () => { prun = null; renderPractice('enter'); };
  prun.done = true;
}
function setMode(m) {
  mode = m; document.querySelectorAll('#rvseg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('.crumb').innerHTML = m === 'practice' ? '<b>复习</b> · 练习不计分' : '<b>复习</b> · 今日 18 张 = 到期 14 + 新词 4';
  if (m === 'practice') renderPractice('enter'); else render('next');
}
document.querySelectorAll('#rvseg button').forEach(b => b.onclick = () => setMode(b.dataset.m));

/* ============ Tibi ============ */
const LEXI = {
  affect: [['为什么不是 effect？', '<p><b>affect</b> 是动词："影响"。<b>effect</b> 通常是名词："效果、影响"。</p><p>记忆法：<b>A</b>ffect 是 <b>A</b>ction（动作），<b>E</b>ffect 是 <b>E</b>nd result（结果）。</p><p>原句 <i style="font-family:var(--f-read)">Delays affect fewer than one in ten journeys</i> 里需要谓语动词，所以用 affect。</p>'], ['再给我两个例句', '<ul><li style="font-family:var(--f-read)">Lack of sleep can <b>affect</b> your memory.</li><li style="font-family:var(--f-read)">The new rules will not <b>affect</b> existing users.</li></ul>']],
  overhead: [['为什么是这个意思？', '<p>overhead 原指"头顶上的"，引申为企业的"日常开支"。在技术语境里指<b>为了完成某事额外付出的代价</b>（时间、内存、性能）。<i style="font-family:var(--f-read)">runtime overhead</i> 就是"运行时开销"。</p>']],
};
function openLexi() {
  const c = Q[idx] || Q[0], qs = LEXI[c.w] || [['为什么是这个意思？', `<p>（原型）正式版会结合你遇到 <b>${esc(c.w)}</b> 的原句，解释它在这里的用法，并对比常见近义词。</p>`], ['再给我两个例句', '<p>（原型）正式版会生成两个难度合适的新例句，尽量用到你正在学的其他词。</p>']];
  $('#dSub').textContent = '· ' + c.w;
  $('#dbody').innerHTML = `<div class="ctxline">正在复习 <b>${esc(c.w)}</b> · ${TYPE[c.type]}${phase === 'ask' && c.type !== 'intro' ? ' · 作答前只给提示' : ''}</div><div class="msgs" id="msgs"></div><div class="suggest" id="sugg">${qs.map((q, i) => `<button data-i="${i}">${q[0]}</button>`).join('')}</div>`;
  document.querySelectorAll('#sugg button').forEach(b => b.onclick = () => ask(qs[+b.dataset.i][0], phase === 'ask' && c.type !== 'intro' ? '<p>提示：看它前后的词，它在句子里是什么成分？</p>' : qs[+b.dataset.i][1]));
  $('#app').classList.add('drawer-open');
}
function ask(q, a) {
  const m = $('#msgs'); m.insertAdjacentHTML('beforeend', `<div class="msg u">${esc(q)}</div><div class="msg a"><span class="typing"><i></i><i></i><i></i></span></div>`);
  DSCROLL.scrollTop = DSCROLL.scrollHeight;
  setTimeout(() => { const last = m.lastElementChild; last.innerHTML = a; anim(last, { opacity: [0, 1], y: [8, 0] }, SPRING); DSCROLL.scrollTop = DSCROLL.scrollHeight; }, 700);
}
$('#lexiBtn').onclick = () => $('#app').classList.contains('drawer-open') ? $('#app').classList.remove('drawer-open') : openLexi();
$('#closeDrawer').onclick = () => $('#app').classList.remove('drawer-open');
$('#dsend').onclick = () => { const v = $('#dinput').value.trim(); if (!v) return; $('#dinput').value = ''; if (!$('#msgs')) openLexi(); ask(v, '<p>（原型）正式版会结合这张卡片、你的复习记录和记忆来回答。</p>'); };
$('#dinput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#dsend').click(); } });

/* ============ 键盘 ============ */
addEventListener('keydown', e => {
  if (e.isComposing || e.metaKey && e.key !== 'Enter' || e.ctrlKey && e.key !== 'Enter' || e.altKey) return;
  const inField = /INPUT|TEXTAREA/.test(e.target.tagName);
  if (e.key === 'Escape') { $('#app').classList.remove('drawer-open'); return; }
  if (e.target.id === 'dinput') return;
  if (mode === 'practice') {
    const r = prun;
    if (!r) { if (e.key === 'Enter' && !inField) { e.preventDefault(); startPractice(); } return; }
    if (r.done) { if (e.key === 'Enter') { e.preventDefault(); startPractice(); } return; }
    if (e.key === 'Enter' && e.target.id === 'pIn' && r.m === 'dict' && !e.shiftKey) { e.preventDefault(); pCheck(); return; }
    if (inField) return;
    if (e.key === 'Enter' && r.shown) { e.preventDefault(); pNext(); return; }
    if (r.m === 'conf' && !r.shown && /^[12]$/.test(e.key)) { const b = document.querySelectorAll('.opts.two .opt')[+e.key - 1]; b && pConf(b.dataset.o); return; }
    if (e.key.toLowerCase() === 'p') { const b = $('#playS'); b && b.click(); }
    return;
  }
  if ($('#resumeBtn') && e.key === 'Enter') { e.preventDefault(); $('#resumeBtn').click(); return; }
  if ($('#backDone') && e.key === 'Enter') { e.preventDefault(); $('#backDone').click(); return; }
  const c = Q[idx]; if (!c || phase === 'done' || phase === 'leaving') return;
  if (e.key === 'Enter' && phase === 'ask' && (e.target.id === 'blank' || e.target.id === 'spellIn')) { e.preventDefault(); check(); return; }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'prodIn') { e.preventDefault(); check(); return; }
  if (inField) return;
  if (c.type === 'intro' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextIntro(); return; }
  if (e.key === ' ' && phase === 'ask' && c.type === 'recognize') { e.preventDefault(); reveal(); return; }
  if (/^[1-4]$/.test(e.key) && phase === 'ask' && c.type === 'choice') { pick(+e.key - 1); return; }
  if (/^[1-4]$/.test(e.key) && phase === 'shown') { if (SELF_RATED.has(c.type) && !c.retry && !drill) rate(+e.key); else if (!c.retry && !drill) commit(+e.key); return; }
  if ((e.key === 'Enter' || e.key === ' ') && phase === 'shown') { e.preventDefault(); if (SELF_RATED.has(c.type) && !c.retry && !drill) rate(3); else commit(pend.g); return; }
  if (e.key.toLowerCase() === 'z') { undo(); return; }
  if (e.key.toLowerCase() === 'l') { openLexi(); return; }
  if (e.key.toLowerCase() === 'p') { const b = $('#playS') || $('#playW') || $('#sayW'); b && b.click(); }
});

/* ============ 启动 ============ */
initShell({}); demoToggle();
if (IS_EMPTY) {
  /* 空状态：今天没有要复习的卡片 */
  $('.crumb').innerHTML = '<b>复习</b> · 今天没有到期的卡片';
  $('#sideH').textContent = '今天要复习'; $('#recent').innerHTML = '<div class="lbl-i" style="padding:4px 12px">没有到期的词</div>';
  emptyState($('#rv'), { img: 'empty-review', title: '今天的复习都做完了', desc: '明天 9 张到期，后天 14 张。', cls: 'card-like',
    actions: [{ t: '读一篇新文章', pri: true, link: 'home' }, { t: '提前复习明天的 9 张', onclick: () => { location.hash = ''; location.reload(); } }, { t: '去练习（听写、易混词）', onclick: () => setMode('practice') }] });
  const ring = $('#ringArc'); if (ring) ring.setAttribute('stroke-dashoffset', 0);
  const bd = document.querySelector('.nav .n.badge'); if (bd) bd.hidden = true;
} else {
  let sv = null; try { sv = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (location.hash === '#practice') setMode('practice');
  else if (sv && sv.Q && sv.idx > 0 && sv.idx < sv.Q.length) renderResume(sv);
  else render('next');
  anim($('.rvbar'), { opacity: [0, 1] }, { duration: 0.4 });
}
