      <span class="sp"></span>
      <button class="pill" id="themeBtn" title="切换深浅色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg></button>
    </header>
    <div class="scroll" id="scroll">
      <div class="page">
        <section class="hero">
          <div class="welcome"><div class="hero-fox" id="heroFox"></div><h1 id="greet">下午好</h1><div class="sub" id="welcomeSub"></div></div>
          <div class="askrow">
          <div class="composer" id="composer">

            <div class="cbar">

        <section class="lead-wrap" id="leadWrap"><a class="lead" id="lead" href="#"></a><div class="also" id="also"></div></section>

        <section>
          <div class="sech"><h2>今天</h2></div>
          <div class="tiles">
            <div class="tile"><span class="k">待复习</span><span class="v"><span data-count="18">0</span><small>张</small></span><span class="d">约 6 分钟</span><button class="go" data-link="review">开始</button></div>
            <div class="tile"><span class="k">今日阅读</span><span class="v"><span data-count="12">0</span><small>/ 20 分钟</small></span><div class="bar2"><i style="width:60%"></i></div></div>
            <div class="tile"><span class="k">已知词</span><span class="v"><span data-count="6214" data-sep="1">0</span><small>词</small></span><span class="d">本周 +38 · 连续 9 天</span><div class="week" id="week"></div></div>
          </div>
        </section>

        <section>
          <div class="sech"><h2>书架</h2><div class="filters" id="filters"><button class="pill on" data-f="all">全部</button><button class="pill" data-f="article">文章</button><button class="pill" data-f="book">书</button></div><a class="more" href="#" data-link="library">全部书架 →</a></div>
          <div class="grid" id="grid"></div>
        </section>
      </div>
    </div>
    <section class="chat" id="chat" aria-label="与 Tibi 的对话">
      <div class="scroll" id="dscroll"></div>
      <div class="dfoot"><div class="dcomp"><textarea id="dinput" placeholder="继续问 Tibi…" aria-label="继续提问"></textarea><button class="send" id="dsend" aria-label="发送"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div>
    </section>
  </section>
</div>

<input type="file" id="fileIn" hidden multiple><!-- 原型不限制类型，选不支持的文件能看到失败态 -->
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/motion@11.11.17/dist/motion.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/overlayscrollbars/2.10.1/browser/overlayscrollbars.browser.es6.min.js"></script>
<script src="v2-fox.js"></script>
<script src="v2-agents.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOCAL = location.protocol === 'file:' || ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
const URLS = LOCAL ? { reader: 'reader.html', words: 'words.html', v1: 'home.html' , review: 'review.html', stats: 'stats.html', settings: 'settings.html', tasks: 'tasks.html', mobile: 'mobile.html', library: 'library.html', onboarding: 'onboarding.html' } : { reader: 'https://claude.ai/artifact/WoQdUMnm2aTwoEaaW2uGiM', words: 'https://claude.ai/artifact/FqP5DF1DAyKoSPj3Ek8AEf', v1: 'https://claude.ai/artifact/25jzi4f4fvQg9qbpiQziqd' , review: 'https://claude.ai/artifact/FTUFPKbBTQ2EV7NmkE8VF4', stats: 'https://claude.ai/artifact/Ry1MR9bvumcJ1cvMZYiH15', settings: 'https://claude.ai/artifact/4os2bCRwuuHXpXp6JYB8pA', tasks: 'https://claude.ai/artifact/FPy1wjttFMjohaYoZ4PWez', mobile: 'https://claude.ai/artifact/9V1ocjyp3cDBiT9aUbkinn', library: 'https://claude.ai/artifact/Cqyenzc3YMxdDTMfKRgrWo', onboarding: 'https://claude.ai/artifact/NbaX6HBbBSW6rmvM9fTPM3' };
const ext = a => { if (!LOCAL) { a.target = '_blank'; a.rel = 'noopener'; } };
const M = window.Motion, REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches, EASE = [0.22, 0.8, 0.24, 1];
const anim = (el, kf, o) => { if (!M || REDUCE || !el || el.length === 0) return; try { return M.animate(el, kf, o); } catch (e) {} };
const stag = (d, o) => (M && M.stagger ? M.stagger(d, o) : 0);
const OSG = window.OverlayScrollbarsGlobal;
function osInit(el) { if (!OSG) return el; try { return OSG.OverlayScrollbars(el, { overflow: { x: 'hidden' }, scrollbars: { theme: 'os-theme-lexi', autoHide: 'scroll', autoHideDelay: 900 } }).elements().viewport; } catch (e) { return el; } }
const MAIN = osInit($('#scroll')), DSCROLL = osInit($('#dscroll'));

/* ---------- 封面：按文章类型使用插画（img/cover-*.jpg） ---------- */
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
// 书架默认不显示封面（设置 → 通用 → 书架显示封面）；文档的 cover 字段保留，有封面且开启时才显示
const SHOW_COVERS = false;
const COVER = { tech: 'img/cover-tech.jpg', news: 'img/cover-news.jpg', novel: 'img/cover-novel.jpg' };
function cover(el, d) {
  const src = SHOW_COVERS ? (d.cover || COVER[d.g]) : null;
  if (!src) { el.parentElement && el.parentElement.classList.add('nocv'); el.remove(); return; }
  el.innerHTML = `<img src="${src}" alt="${esc(d.t)} 封面" class="g-${d.g}" loading="lazy" decoding="async">`;
}

/* ---------- 示例数据 ---------- */
const GEN = { tech: '技术', news: '新闻', lit: '文学', academic: '学术', general: '一般' };   // 类型 = 处理策略；形态（文章 / 书）与标签另算（D10）
const KIND = { article: '文章', book: '书' };
const SUGGEST = { tech: ['Rust', '内存管理'], news: ['城市', '气候'], lit: ['经典小说'], academic: ['机器学习'], general: ['随笔'] };
/* 首页没有引入 v2-shell.js：这里放一份同样的空状态与演示开关 */
const IS_EMPTY = location.hash === '#empty';
const mascotImg = id => `<img src="img/mascot/${id}.webp" srcset="img/mascot/${id}.webp 1x, img/mascot/${id}@2x.webp 2x" alt="">`;
function emptyState(el, { state = 'idle', img, title, desc, actions = [], cls = '', extra = '' } = {}) {
  el.innerHTML = `<div class="empty ${cls}"><div class="fx${img ? ' art' : ''}">${img ? mascotImg(img) : ''}</div><h3>${title}</h3>${desc ? `<p>${desc}</p>` : ''}${extra}${actions.length ? `<div class="acts">${actions.map((a, i) => a.link ? `<a class="btn${a.pri ? ' pri' : ''}" data-link="${a.link}" href="#">${a.t}</a>` : `<button class="btn${a.pri ? ' pri' : ''}" data-ea="${i}">${a.t}</button>`).join('')}</div>` : ''}</div>`;
  if (!img && window.Fox) Fox.mount(el.querySelector('.fx'), { state, size: 132, interactive: true });
  el.querySelectorAll('[data-link]').forEach(a => { a.href = URLS[a.dataset.link]; ext(a); });
  el.querySelectorAll('[data-ea]').forEach(b => b.onclick = actions[+b.dataset.ea].onclick);
  anim(el.firstElementChild, { opacity: [0, 1], y: [8, 0] }, { duration: 0.4, ease: EASE });
}
/* 桌面原型在手机上打开时的提示（桌面应用最小窗口 960px，手机端是独立的壳） */
function phoneHint() {
  if (!((screen.width < 960 && navigator.maxTouchPoints > 0) || (visualViewport && visualViewport.width < 960))) return; /* 桌面页有 min-width，innerWidth 不可靠 */
  const d = document.createElement('div'); d.className = 'phone-hint';
  d.innerHTML = `这是桌面版原型（窗口最小 960px）。手机上请看 <a href="${URLS.mobile}">手机版原型</a>`; ext(d.querySelector('a'));
  document.body.appendChild(d);
}
phoneHint();
function demoToggle() { const b = document.createElement('button'); b.className = 'demo-tog'; b.innerHTML = `原型演示：<b>${IS_EMPTY ? '空状态' : '有数据'}</b> · 切换到${IS_EMPTY ? '有数据' : '空状态'}`; b.onclick = () => { location.hash = IS_EMPTY ? '' : '#empty'; location.reload(); }; document.body.appendChild(b); }
const SAMPLES = [
  { g: 'lit', t: 'The Gift of the Magi', mins: 12, src: 'O. Henry · 公有领域' },
  { g: 'tech', t: 'How a Compiler Sees Your Code', mins: 6, src: '自拟示例' },
  { g: 'news', t: 'Why Cities Are Getting Hotter', mins: 5, src: '自拟示例' },
];
const DOCS = [
  { id: 'tech', kind: 'article', ex: 'Ownership is the feature that makes Rust distinctive among systems languages.', g: 'tech', tags: ['Rust', '内存管理'], t: 'Understanding Ownership in Rust', src: '自拟示例', mins: 4, ratio: 7.2, lv: ['偏难', 'hard'], p: 45, open: true, quote: 'If you only need to read the data, you can borrow it instead.' },
  { id: 'novel', kind: 'book', ex: 'It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.', g: 'lit', tags: ['经典小说'], t: 'Pride and Prejudice', src: 'Jane Austen', book: { ch: 1, of: 61, chp: 62 }, mins: 2, ratio: 2.6, lv: ['学习区', 'mid'], p: 8, open: true },
  { id: 'news', kind: 'article', ex: 'From Rotterdam to Wuhan, planners are embracing so-called sponge designs.', g: 'news', tags: ['城市', '气候'], t: 'Cities Turn to Sponge Design as Floods Intensify', src: '自拟示例', mins: 3, ratio: 9.8, lv: ['偏难', 'hard'], p: 0, open: true },
  { id: 'rustbook', kind: 'book', ex: 'This book assumes that you have written code in another programming language.', g: 'tech', tags: ['Rust'], t: 'The Rust Programming Language', src: 'Klabnik & Nichols', book: { ch: 4, of: 21, chp: 30 }, mins: 9, ratio: 3.4, lv: ['学习区', 'mid'], p: 15 },
  { id: 'async', kind: 'article', ex: 'Concurrency is about dealing with many things at once, not doing them at once.', g: 'tech', tags: ['Rust', '异步'], t: 'A Gentle Introduction to Async Rust', src: '自拟示例', mins: 9, ratio: 3.1, lv: ['学习区', 'mid'], p: 0 },
  { id: 'holmes', kind: 'article', ex: 'To Sherlock Holmes she is always the woman.', g: 'lit', tags: ['福尔摩斯', '经典小说'], t: 'A Scandal in Bohemia', src: 'Arthur Conan Doyle', mins: 38, ratio: 4.4, lv: ['学习区', 'mid'], p: 12 },
  { id: 'trains', kind: 'article', ex: 'The distinctive hum of a sleeper carriage is back on several routes.', g: 'news', tags: ['旅行'], t: 'The Quiet Return of Night Trains in Europe', src: '自拟示例', mins: 5, ratio: 1.6, lv: ['舒适', 'ok'], p: 100 },
  { id: 'ctx', kind: 'article', ex: 'Attention cost grows quadratically with the length of the input.', g: 'academic', tags: ['机器学习', 'Transformer'], t: 'How Transformers Handle Long Context', src: '自拟示例', mins: 12, ratio: 6.3, lv: ['偏难', 'hard'], p: 0 },
];
let filter = 'all', tier = '快速', agent = null;
if (IS_EMPTY) DOCS.length = 0;   // 原型演示：第一次打开，书架为空

/* ---------- 渲染 ---------- */
function renderCont() {
  const reading = DOCS.filter(d => d.p > 0 && d.p < 100), d = reading[0];
  $('#leadWrap').hidden = !d; if (!d) return;
  const left = Math.max(1, Math.round(d.mins * (1 - (d.book ? d.book.chp : d.p) / 100)));
  $('#lead').href = d.open ? URLS.reader : '#'; ext($('#lead'));
  $('#lead').innerHTML = `<div class="k">继续读 · ${d.book ? `书 · 第 ${d.book.ch} 章` : GEN[d.g]}</div><div class="t">${esc(d.t)}</div>${d.quote || d.ex ? `<p class="x">${esc(d.quote || d.ex)}</p>` : ''}<div class="m"><div class="bar2"><i style="width:${d.book ? d.book.chp : d.p}%"></i></div><span>${d.book ? '本章' : '读到'} ${d.book ? d.book.chp : d.p}% · 还剩约 ${left} 分钟</span><span class="btn pri">继续</span></div>`;
  $('#also').innerHTML = reading.slice(1, 4).length ? '<span>还在读</span>' + reading.slice(1, 4).map(x => `<a href="${x.open ? URLS.reader : '#'}" data-id="${x.id}">${esc(x.t)}${x.book ? ` · 第 ${x.book.ch} 章` : ` · ${x.p}%`}</a>`).join('') : '';
  document.querySelectorAll('#also a').forEach(a => { if (a.getAttribute('href') !== '#') ext(a); else a.onclick = e => { e.preventDefault(); toast('原型中只有阅读器里的三篇可以打开'); }; });
}
function renderGrid(animate, newId) {
  const list = DOCS.filter(d => filter === 'all' || d.kind === filter);
  $('#grid').classList.toggle('is-empty', !DOCS.length);
  if (!DOCS.length) {
    $('#filters').hidden = true;
    emptyState($('#grid'), { img: 'empty-library', title: '书架还是空的', desc: '粘贴网址或拖入文件就能导入，也可以先读一篇示例。', cls: 'card-like',
      extra: `<div class="samples">${SAMPLES.map((d, i) => `<button class="sample" data-sm="${i}"><span class="g">${GEN[d.g]} · 示例</span><span class="t">${esc(d.t)}</span><span class="m">约 ${d.mins} 分钟 · ${d.src}</span></button>`).join('')}</div>` });
    $('#grid').querySelectorAll('[data-sm]').forEach(b => b.onclick = () => { const d = SAMPLES[+b.dataset.sm]; runImport('sample:' + d.t); });
    return;
  }
  $('#filters').hidden = false;
  $('#grid').innerHTML = list.map(d => `<a class="card${d.id === newId ? ' new' : ''}" href="${d.open ? URLS.reader : '#'}" data-id="${d.id}"><span class="cv" data-cover="${d.id}"></span>
    <div class="row"><span class="g">${d.kind === 'book' ? '书 · ' : ''}${GEN[d.g]}</span><span class="g">${d.p >= 100 ? '已读完' : d.p > 0 ? d.p + '%' : d.mins + ' 分钟'}</span></div>
