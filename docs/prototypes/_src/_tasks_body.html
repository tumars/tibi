%SIDE%
  <section class="main">
    <header class="top">
      <button class="ibtn" id="menuBtn" title="菜单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>

    <div class="scroll" id="scroll">

  </aside>
</div>

      <div class="b">${t.appr.body}</div>
      <div class="impact"><span>将执行</span><code>${esc(t.appr.tool)}</code><span>· ${t.appr.tool === 'remember' ? '写入 1 条记忆' : '新增 3 篇到书架'} · 可撤销</span><span class="k">A 允许 · R 拒绝</span></div>
      <div class="prov-line">${esc(t.appr.src)} · 技能：${skillOf(t.agent)} · <button data-open="${t.id}">查看过程</button></div>
      <div class="acts"><button class="btn sm pri" data-ok="${t.id}">允许</button><button class="btn sm" data-no="${t.id}">拒绝</button>${t.appr.edit ? `<button class="btn sm" data-ed="${t.id}">修改后允许</button>` : ''}<label class="chk"><input type="checkbox" data-always="${t.id}">以后这类都自动允许</label></div>
    </div>`).join('') : '<div class="none">没有需要你确认的事。</div>';
  $('#appr').querySelectorAll('[data-ok]').forEach(b => b.onclick = () => decide(b.dataset.ok, true));
  $('#appr').querySelectorAll('[data-no]').forEach(b => b.onclick = () => decide(b.dataset.no, false));
  $('#appr').querySelectorAll('[data-open]').forEach(b => b.onclick = () => openTask(b.dataset.open));
  $('#appr').querySelectorAll('[data-ed]').forEach(b => b.onclick = () => {
    const card = b.closest('.approve'), t = TASKS.find(x => x.id === b.dataset.ed); if (card.querySelector('.edit')) return;
    const ta = document.createElement('textarea'); ta.className = 'edit'; ta.value = t.appr.edit; card.querySelector('.b').after(ta); ta.focus();
    b.textContent = '保存并允许'; b.onclick = () => { t.appr.body = esc(ta.value); decide(t.id, true, '已按你的修改记住'); };
  });
}
function decide(id, ok, msg) {
  const t = TASKS.find(x => x.id === id), always = $(`[data-always="${id}"]`)?.checked, card = $(`.approve[data-id="${id}"]`);
  const s = flat(t.steps).find(x => x.s === 'appr'); s.s = ok ? 'ok' : 'err'; s.tm = ok ? '确认' : '已拒绝';
  t.tx.push(['a', ok ? '已获你允许，继续。' : '你拒绝了，这一步跳过。']);
  if (ok) { t.state = 'run'; setTimeout(() => finish(t), 1400); } else { t.state = 'done'; t.err = null; t.note = '你拒绝了写入'; }
  const go = () => { renderAll(); if (selId === id) renderDetail(); toast(msg || (ok ? '已允许' : '已拒绝') + (always ? ' · 以后这类自动允许' : ''), () => toast('原型：正式版可撤销这次写入')); };
  if (card) { anim(card, { opacity: [1, 0], x: [0, ok ? 16 : -16] }, { duration: 0.22 }); setTimeout(go, REDUCE ? 0 : 220); } else go();
}
function finish(t) { flat(t.steps).forEach(s => { if (s.s !== 'err') { s.s = 'ok'; s.tm = s.tm || '0.3s'; } }); t.state = 'done'; t.start = '刚刚'; TASKS = [t, ...TASKS.filter(x => x !== t)]; renderAll(); if (selId === t.id) renderDetail(); }
function rowRun(t) {
  const c = curStep(t), sub = t.steps.find(s => s.agent && (s.s === 'run'));
  return `<div class="trow${t.id === selId ? ' cur' : ''}" data-id="${t.id}">${agentAv('tibi', 'lg')}
    <div style="min-width:0"><div class="t">${titleHtml(t)}</div>
      <div class="s"><span class="run">● ${esc(c ? c.t : '收尾')}</span><span class="stepn">· 第 ${Math.min(t.steps.length, t.steps.filter(s => s.s === 'ok').length + 1)} / ${t.steps.length} 步${t.paused ? ' · 已暂停' : ` · 还剩约 ${Math.max(2, (t.steps.length - t.steps.filter(s => s.s === 'ok').length) * 3)} 秒`}</span><span>· ${skillOf(t.agent)}</span><span>· ${fmtCost(t.cost)}</span></div>
      <div class="bar2"><i style="width:${progress(t)}%"></i></div></div>
    <div class="acts"><button class="ibtn" data-pause="${t.id}" title="${t.paused ? '继续' : '暂停'}">${t.paused ? PLAY : PAUSE}</button><button class="ibtn" data-cancel="${t.id}" title="取消">${STOP}</button></div></div>`;
}
function rowHist(t) {
  const icon = t.state === 'done' ? `<span class="st ok">${OK}</span>` : t.state === 'err' ? `<span class="st err">${BANG}</span>` : `<span class="st cancel">${X}</span>`;
  return `<div class="trow${t.id === selId ? ' cur' : ''}" data-id="${t.id}">${agentAv('tibi', 'lg')}
    <div style="min-width:0"><div class="t">${titleHtml(t)}</div>
      <div class="s">${icon}${t.state === 'err' ? `<span class="err">${esc(t.err)}</span>` : t.state === 'cancel' ? '<span>已取消</span>' : t.note ? `<span class="warn">${esc(t.note)}</span>` : '<span>完成</span>'}<span>· ${skillOf(t.agent)}</span><span>· ${t.start}</span><span>· ${fmtDur(t.dur)}</span><span>· ${fmtCost(t.cost)}</span></div></div>
    <div class="acts">${t.state === 'err' || t.state === 'cancel' ? `<button class="btn sm" data-retry="${t.id}">重试</button>` : ''}</div></div>`;
}
function renderLists() {
  const run = TASKS.filter(t => t.state === 'run'), hist = TASKS.filter(t => ['done', 'err', 'cancel'].includes(t.state));
  $('#run').innerHTML = run.length ? run.map(rowRun).join('') : '<div class="none">现在没有运行中的任务。</div>';
  const dayOf = t => /^(刚刚|今天)/.test(t.start) ? '今天' : /^昨天/.test(t.start) ? '昨天' : '更早'; let lastDay = '';
  $('#hist').innerHTML = hist.map(t => { const d = dayOf(t); const h = d !== lastDay ? `<div class="dayh">${d}</div>` : ''; lastDay = d; return h + rowHist(t); }).join('');
  $('#sched').innerHTML = SCHED.map((s, i) => `<div class="trow sched" data-s="${i}"><span class="av-ag lg">${agentIcon(s.agent, 17)}</span><div style="min-width:0"><div class="t">${esc(s.label)}</div><div class="s"><span class="when">${s.on ? '下次：' + s.next + ' · ' + skillOf(s.agent) : '已关闭'}</span></div></div>
    <div class="acts"><button class="btn sm" data-now="${i}">立即运行</button><button class="switch" role="switch" aria-checked="${s.on}" aria-label="例行任务开关" data-sw="${i}"></button></div></div>`).join('');
  document.querySelectorAll('.trow[data-id]').forEach(r => r.onclick = e => { if (e.target.closest('button')) return; openTask(r.dataset.id); });
  document.querySelectorAll('[data-pause]').forEach(b => b.onclick = () => { const t = TASKS.find(x => x.id === b.dataset.pause); t.paused = !t.paused; renderAll(); toast(t.paused ? '已暂停：完成当前这一步后停下' : '已继续'); });
  document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { const t = TASKS.find(x => x.id === b.dataset.cancel); t.state = 'cancel'; t.start = '刚刚'; t.tx.push(['a', '（你取消了这个任务，已完成的步骤保留，正在用的技能一并停止）']); renderAll(); if (selId === t.id) renderDetail(); toast('已取消', () => { t.state = 'run'; renderAll(); }); });
  document.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => retry(b.dataset.retry));
  document.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => { const s = SCHED[+b.dataset.sw]; s.on = !s.on; renderAll(); toast(s.on ? `已开启：${s.label}` : '已关闭这项例行任务'); });
  document.querySelectorAll('[data-now]').forEach(b => b.onclick = () => { const s = SCHED[+b.dataset.now]; const id = 'n' + Date.now();
    TASKS.unshift({ id, state: 'run', agent: s.agent, title: s.label, trigger: '你手动运行了例行任务', model: agentById(s.agent).model, start: '刚刚', dur: 0, tokens: 0, cost: 0, steps: [st('准备', 'run'), st('执行', 'wait'), st('整理结果', 'wait')], tx: [['a', '（原型）开始运行。']] });
    renderAll(); toast(`已开始：${s.label}`); });
}
function retry(id) {
  const t = TASKS.find(x => x.id === id); flat(t.steps).forEach(s => { if (s.s === 'err' || s.s === 'wait') s.s = 'wait'; }); const first = flat(t.steps).find(s => s.s === 'wait'); if (first) first.s = 'run';
  t.state = 'run'; t.err = null; t.start = '刚刚'; t.tx.push(['a', '重试：从失败的那一步继续，已完成的步骤不再重跑。']); renderAll(); if (selId === id) renderDetail(); toast('已从失败的那一步重试');
}
function renderAll() { renderFilter(); renderKpis(); renderAppr(); renderLists(); markKb(); }

/* 键盘：J / K 在任务间移动，Enter 打开详情，A / R 允许或拒绝当前确认项，Esc 关闭 */
let kbId = null;
function kbList() { return [...document.querySelectorAll('.approve[data-id], .trow[data-id]')].map(el => el.dataset.id); }
function markKb() { document.querySelectorAll('.approve, .trow').forEach(el => el.classList.toggle('kb', el.dataset.id === kbId)); }
addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), ids = kbList();
  if (k === 'j' || e.key === 'ArrowDown') { e.preventDefault(); kbId = ids[Math.min(ids.length - 1, ids.indexOf(kbId) + 1)]; markKb(); const el = document.querySelector(`[data-id="${kbId}"]`); el && el.scrollIntoView({ block: 'nearest' }); return; }
  if (k === 'k' || e.key === 'ArrowUp') { e.preventDefault(); kbId = ids[Math.max(0, ids.indexOf(kbId) - 1)]; markKb(); const el = document.querySelector(`[data-id="${kbId}"]`); el && el.scrollIntoView({ block: 'nearest' }); return; }
  if (!kbId) return; const t = TASKS.find(x => x.id === kbId);
  if (e.key === 'Enter') { openTask(kbId); return; }
  if (t && t.state === 'appr' && k === 'a') { decide(kbId, true); return; }
  if (t && t.state === 'appr' && k === 'r') { decide(kbId, false); return; }
});

/* 原型演示：运行中的任务每隔几秒前进一步，做完后进历史并弹一条带动作的通知（借鉴"后台任务要主动告知完成"） */
function tick() {
  const t = TASKS.find(x => x.id === 't1' && x.state === 'run' && !x.paused); if (!t) return;
  const all = flat(t.steps); const cur = all.find(s => s.s === 'run'); if (cur) { cur.s = 'ok'; cur.tm = (0.4 + Math.random() * 2).toFixed(1) + 's'; }
  const next = all.find(s => s.s === 'wait'); if (next) { next.s = 'run'; if (next.kids) next.kids.forEach(k => k.s = 'run'); t.dur += 3; t.tokens += 900; t.cost += 0.002; renderAll(); if (selId === t.id) renderDetail(); setTimeout(tick, 3200); }
  else { t.state = 'done'; t.start = '刚刚'; t.tx.push(['a', '导入完成：生词 50 · 待确认 13 · 生词率 4.5%（学习区）。']); renderAll(); if (selId === t.id) renderDetail(); toast('《Pin, and Why It Exists》导入完成，可以开始读了', () => toast('原型：会打开阅读器'), '开始阅读'); }
}
setTimeout(tick, 2500);

/* ---------- 详情 ---------- */
function stepHtml(s) {
  const ic = s.s === 'ok' ? OK : s.s === 'err' ? BANG : '';
  const label = s.agent ? `<span class="sub">${esc(s.t)}<small>技能</small></span>` : esc(s.t);
  return `<div class="step ${s.s}"><span class="ic">${ic}</span><span>${label}</span><span class="tm">${s.s === 'appr' ? '等你确认' : esc(s.tm || '')}</span></div>${s.kids ? `<div class="kids">${s.kids.map(stepHtml).join('')}</div>` : ''}`;
}
function txHtml(x) {
  if (x[0] === 'u') return `<div class="u">${esc(x[1])}</div>`;
  if (x[0] === 'a') return `<div class="a">${esc(x[1])}</div>`;
  return `<div class="tcall"><span class="tm">${esc(x[4] || '')}</span><span class="n">${esc(x[1])}</span>(${esc(x[2])})<div class="r">${esc(x[3])}</div></div>`;
}
function renderDetail() {
  const t = TASKS.find(x => x.id === selId); if (!t) return; const a = agentById(t.agent);
  $('#dTitle').innerHTML = `${agentAv('tibi')}<span>${esc(t.title)}${t.doc ? ' · ' + esc(t.doc) : ''}</span>`;
  const status = { run: '运行中', appr: '等你确认', done: '完成', err: '失败', cancel: '已取消' }[t.state];
  $('#dbody').innerHTML = `
    <dl class="meta"><dt>状态</dt><dd>${status}${t.err ? ` · <span style="color:var(--hard)">${esc(t.err)}</span>` : ''}</dd>
      <dt>技能</dt><dd>${a.skill}</dd><dt>触发</dt><dd>${esc(t.trigger)}</dd><dt>模型</dt><dd>${MODEL_NAME[t.model]}</dd>
      <dt>开始</dt><dd>${t.start} · 用时 ${fmtDur(t.dur)}</dd><dt>用量</dt><dd>${t.tokens.toLocaleString()} token · ${fmtCost(t.cost)}</dd></dl>
    <div class="blk"><h3>步骤</h3><div class="tree">${t.steps.map(stepHtml).join('')}</div></div>
    <div class="blk"><h3>过程</h3><div class="tx">${t.tx.map(txHtml).join('')}</div></div>
    <div class="dacts">${t.state === 'err' || t.state === 'cancel' ? `<button class="btn sm pri" id="dRetry">重试</button>` : ''}${t.state === 'appr' ? `<button class="btn sm pri" id="dOk">允许</button><button class="btn sm" id="dNo">拒绝</button>` : ''}<a class="btn sm" data-link="home" href="#" id="dCont">在对话中继续</a><button class="btn sm" id="dCopy">复制诊断信息</button></div>`;
  $('#dCont').href = URLS.home; ext($('#dCont'));
  $('#dRetry') && ($('#dRetry').onclick = () => retry(t.id));
  $('#dOk') && ($('#dOk').onclick = () => decide(t.id, true)); $('#dNo') && ($('#dNo').onclick = () => decide(t.id, false));
  $('#dCopy').onclick = () => toast('原型：会复制任务 ID、步骤、工具调用与错误（不含 API Key 和文章正文）');
}
function openTask(id) {
  selId = id; renderLists(); renderDetail(); const was = $('#app').classList.contains('drawer-open'); $('#app').classList.add('drawer-open');
  anim($('#dbody'), { opacity: [0, 1], y: [was ? 6 : 12, 0] }, { duration: 0.35, ease: EASE }); DSCROLL.scrollTop = 0;
}
function closeDrawer() { $('#app').classList.remove('drawer-open'); selId = null; renderLists(); }
$('#closeDrawer').onclick = closeDrawer;
addEventListener('keydown', e => { if (e.key === 'Escape' && !document.querySelector('.cmdk:not([hidden])')) closeDrawer(); });

/* ---------- 模拟：运行中的任务向前推进 ---------- */
const TOOL_OF = { '分句、词形还原': 'segment_document', '对照你的词库标注': 'annotate_terms', 'AI 分析（3 个子任务并行）': 'summarize · extract_phrases · find_hard_sentences', '保存到书架': 'save_document', '按生词率排序': 'scout → estimate_difficulty' };
setInterval(() => {
  let changed = false;
  TASKS.filter(t => t.state === 'run' && !t.paused).forEach(t => {
    t.dur += 2; t.tokens += 180 + (hash(t.id + t.dur) % 400); t.cost += 0.0004; changed = true;
    const all = flat(t.steps), i = all.findIndex(s => s.s === 'run');
    if (i < 0) { finish(t); toast(`Tibi 做完了：${t.doc || t.title}`); return; }
    if (hash(t.id + t.dur) % 3 === 0) {
      const s = all[i]; s.s = 'ok'; s.tm = (1 + hash(s.t) % 30 / 10).toFixed(1) + 's';
      if (s.kids) s.kids.forEach(k => { k.s = 'ok'; k.tm = k.tm || (2 + hash(k.t) % 90 / 10).toFixed(1) + 's'; });
      const parent = t.steps.find(p => p.kids && p.kids.includes(s)); if (parent && parent.kids.every(k => k.s === 'ok')) { parent.s = 'ok'; parent.tm = parent.tm || (2 + hash(parent.t) % 40 / 10).toFixed(1) + 's'; }
      const nx = flat(t.steps).find(x => x.s === 'wait'); if (nx) { nx.s = 'run'; if (nx.kids) nx.kids.forEach(k => k.s = 'run'); const tool = TOOL_OF[nx.t]; t.tx.push(tool ? ['c', tool, '{ document: "draft-12" }', '进行中…', ''] : ['a', `开始：${nx.t}`]); }
    }
  });
  if (changed) { renderFilter(); renderKpis(); renderLists(); if (selId && TASKS.find(t => t.id === selId)?.state === 'run') renderDetail(); }
}, 2000);

initShell({}); demoToggle();
if (IS_EMPTY) { TASKS = []; }
renderAll();
if (IS_EMPTY) {
  $('#secAppr').hidden = true; $('#secHist').hidden = true; $('#filter').hidden = true;
  emptyState($('#run'), { state: 'idle', img: 'empty-tasks', title: 'Tibi 还没做过事', desc: '导入一篇文章、找文章，或者问 Tibi 一个问题，它做事的过程、要你确认的改动和花费都会出现在这里。', cls: '',
    actions: [{ t: '去首页导入一篇文章', pri: true, link: 'home' }, { t: '看看 Tibi 的技能', link: 'settings' }] });
  $('#kpis').innerHTML = `<div class="kpi"><span class="k">运行中</span><span class="v">0<small>个</small></span></div><div class="kpi"><span class="k">本周完成</span><span class="v">0<small>个</small></span></div><div class="kpi"><span class="k">本月花费</span><span class="v">¥0.00<small>/ 预算 ¥20</small></span><div class="bar2"><i style="width:0%"></i></div></div><div class="kpi"><span class="k">花得最多的技能</span><span class="v" style="font-size:16px;margin-top:4px;color:var(--ink-3)">还没有</span></div>`;
  $('#secRun h2').innerHTML = '运行中 <span class="n">0</span>';
  const badge = document.getElementById('navTasks'); if (badge) badge.hidden = true;
}
anim(document.querySelectorAll('.tk > section'), { opacity: [0, 1], y: [10, 0] }, { duration: 0.45, ease: EASE, delay: stag(0.05) });
if (/^#t=/.test(location.hash)) setTimeout(() => openTask(location.hash.slice(3)), 300);
addEventListener('hashchange', () => { if (/^#t=/.test(location.hash)) openTask(location.hash.slice(3)); });
</script>
