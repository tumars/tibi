[package]
name = "tibi"
version = "0.1.0"
description = "Tibi（提比）：本地优先、AI 原生的英语阅读学习工具"
authors = ["Tibi contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tibi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 在电脑上按手机的方式跑（Core 在 WebView 里、SQLite 走 local_db）：预览手机版、在没有 Xcode / NDK 的机器上检查这段能编译
mobile-preview = ["dep:rusqlite", "dep:tauri-plugin-http"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
base64 = "0.22"
tauri-plugin-http = { version = "2", optional = true }

# 软件更新只在桌面端（update.rs）；手机走应用商店
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-updater = "2"

# Linux：Secret Service（GNOME 钥匙串 / KWallet），重启后还在。keyring 的 linux-native 是内核 keyutils，重启就没了，不用
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"

# Windows / Linux：深链会再起一个进程，交给已经开着的那个（deep-link 特性会转发 URL）
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# 手机（M7）：Core 在 WebView 里，SQLite 由 rusqlite 提供（自带 FTS5）；网页和 WebDAV 走 http 插件（不受 CORS 限制）
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-http = "2"

# iOS：iCloud Drive 容器路径（sync_fs.rs）
[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }

# Android：随包资源在 APK 的 assets 里，不是文件；经 fs 插件读出来拷到 app_data_dir（local_db.rs 的词典）
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
