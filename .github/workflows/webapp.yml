# Web 版（docs/design/12-web.md §7）：推到 main 且改了界面 / Core 时，打 dist-web 并部署到 EdgeOne Makers（app.tibi.ferecord.com）。
# 要先在仓库里配：
# - secrets.EDGEONE_API_TOKEN：Makers 控制台 → API Token
# - vars.EDGEONE_PROJECT：Makers 项目名（"直接上传"类型；没配时默认 tibi-app，第一次部署会新建）
# 没配 Token 时只打包、上传成 Actions 产物，不部署。
name: Web 版
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/src/**'
      - 'apps/desktop/web/**'
      - 'apps/desktop/public/**'
      - 'apps/desktop/web.html'
      - 'apps/desktop/vite.config.ts'
      - 'apps/desktop/scripts/build-webapp.mjs'
      - 'apps/desktop/scripts/web-dict.mjs'
      - 'apps/desktop/package.json'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/webapp.yml'
  workflow_dispatch:
    inputs:
      env:
        description: 部署到哪个环境
        type: choice
        options: [production, preview]
        default: production

concurrency:
  group: webapp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 和 release.yml 共用同一份词典缓存
      - uses: actions/cache@v4
        id: dict
        with:
          path: data/ecdict/dict.db
          key: ecdict-${{ hashFiles('packages/core-node/src/ecdict/*.ts') }}
      - if: steps.dict.outputs.cache-hit != 'true'
        run: pnpm ecdict
      - run: pnpm --filter @tibi/desktop build:webapp
        env:
          TIBI_DICT_DB: ${{ github.workspace }}/data/ecdict/dict.db
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: apps/desktop/dist-web
          retention-days: 7
      - name: 部署到 EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          PROJECT: ${{ vars.EDGEONE_PROJECT || 'tibi-app' }}
          DEPLOY_ENV: ${{ inputs.env || 'production' }}
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then echo "没配 EDGEONE_API_TOKEN，跳过部署"; exit 0; fi
          npx --yes edgeone@1.6.47 makers deploy apps/desktop/dist-web -n "$PROJECT" -e "$DEPLOY_ENV" -t "$EDGEONE_API_TOKEN"
