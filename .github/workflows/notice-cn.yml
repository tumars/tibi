# 可选的 CI 公告发布入口；客户端只从腾讯云读取，日常也可 pnpm publish:cos notice 直接发布。
# 字段见 apps/desktop/src/lib/notice.ts；格式不对 CI 的 test/notice.test.ts 会先拦下。
# 用 mirror-cn.yml 同一组密钥，缺少配置时明确失败。
name: Notice to Tencent COS
on:
  push:
    branches: [main]
    paths: [notice.json]
  workflow_dispatch:

concurrency:
  group: notice-cn

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://dl.ferecord.com
      BUCKET: ${{ secrets.CN_S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.CN_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CN_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CN_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.CN_S3_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: 检查发布配置
        run: |
          for k in BUCKET S3_ENDPOINT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION; do
            if [ -z "${!k}" ]; then echo "::error::缺少 $k，无法发布公告"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 校验公告、发布到腾讯云并验证公开地址
        run: pnpm publish:cos notice
