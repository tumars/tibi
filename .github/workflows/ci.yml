# 每个 PR / 推送：生成文件是否最新、类型检查、单测、界面构建、Rust 壳编译检查
name: CI
on:
  push:
    branches: [main, m0-scaffold]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 内嵌文件（sql / skills / samples）是最新的
        run: pnpm --filter @tibi/core gen && git diff --exit-code
      - run: pnpm -r typecheck
      - name: 界面文案都有英文
        run: pnpm --filter @tibi/desktop i18n:check
      - run: pnpm test
      - run: pnpm --filter @tibi/desktop build:web

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 系统库（WebKitGTK 等）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: 占位 sidecar（externalBin 要求文件存在）
        run: node apps/desktop/scripts/sidecar-dev.mjs
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - name: 手机那条路（Core 在 WebView 里、local_db）也能编译
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --features mobile-preview

  android:
    # 手机 Android 目标的 Rust 部分能编译（runner 自带 NDK；APK 打包要 Gradle，留给发布流程 / 本机，见开发说明 §6）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: 前端产物占位（不打包，只让 frontendDist 指的目录存在）
        run: mkdir -p apps/desktop/dist && touch apps/desktop/dist/index.html apps/desktop/dist/mobile.html
      - name: cargo check（aarch64-linux-android）
        run: |
          TC=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC_aarch64_linux_android=$TC/aarch64-linux-android24-clang AR_aarch64_linux_android=$TC/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TC/aarch64-linux-android24-clang
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --target aarch64-linux-android

  ios:
    # iOS 目标的 Rust 部分（iCloud 容器、App Group 走 objc2-foundation）能编译；两个扩展的 Swift 对 iOS SDK 做类型检查。
    # 打 .ipa 要签名和 gen/apple 工程（tauri ios init，要 Apple 开发者账号），不在 CI 里做，见开发说明 §6。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ios
      - name: 前端产物占位（不打包，只让 frontendDist 指的目录存在）
        run: mkdir -p apps/desktop/dist && touch apps/desktop/dist/index.html apps/desktop/dist/mobile.html
      - name: cargo check（aarch64-apple-ios）
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --target aarch64-apple-ios
      - name: Safari 分享扩展、小组件（Swift）类型检查
        working-directory: apps/desktop/src-tauri/ios-extensions
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          for f in ShareExtension/ShareViewController.swift TibiWidget/TibiWidget.swift; do
            echo "== $f"
            xcrun swiftc -typecheck -parse-as-library -sdk "$SDK" -target arm64-apple-ios17.0-simulator "$f"
          done
