# 每个 PR / 推到 main：生成文件是否最新、类型检查、单测、界面构建（Linux，便宜）。
# 省 Actions 分钟（私有仓库：Linux ×1、Windows ×2、macOS ×10 计）：
# - 只改文档（docs/、*.md）的提交不跑；
# - Rust 壳的 clippy、Android 编译检查只在 src-tauri 有改动时跑；
# - iOS 编译检查（macOS）只在手动触发时勾选才跑（Actions 页面 → CI → Run workflow）。
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      ios:
        description: 也跑 iOS 编译检查（macOS runner，按 10 倍计分钟）
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 这次改了哪些地方：Rust 壳（src-tauri、Cargo）有改动才跑 rust / android
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shell: ${{ steps.f.outputs.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            shell:
              - 'apps/desktop/src-tauri/**'
              - '.github/workflows/ci.yml'

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 内嵌文件（sql / skills / samples）是最新的
        run: pnpm --filter @tibi/core gen && git diff --exit-code
      - run: pnpm -r typecheck
      - name: 界面文案都有英文
        run: pnpm --filter @tibi/desktop i18n:check
      - run: pnpm test
      - run: pnpm --filter @tibi/desktop build:web

  rust:
    needs: changes
    if: needs.changes.outputs.shell == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 系统库（WebKitGTK 等）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: 占位 sidecar（externalBin 要求文件存在）
        run: node apps/desktop/scripts/sidecar-dev.mjs
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - name: 手机那条路（Core 在 WebView 里、local_db）也能编译
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --features mobile-preview

  android:
    # 手机 Android 目标的 Rust 部分能编译（runner 自带 NDK；APK 打包要 Gradle，留给发布流程 / 本机，见开发说明 §6）
    needs: changes
    if: needs.changes.outputs.shell == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: 占位：前端产物和词典（不打包；手机配置把 resources/dict.db 列为资源，tauri-build 要求文件存在）
        run: mkdir -p apps/desktop/dist apps/desktop/src-tauri/resources && touch apps/desktop/dist/index.html apps/desktop/dist/mobile.html apps/desktop/src-tauri/resources/dict.db
      - name: cargo check（aarch64-linux-android）
        run: |
          TC=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC_aarch64_linux_android=$TC/aarch64-linux-android24-clang AR_aarch64_linux_android=$TC/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TC/aarch64-linux-android24-clang
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --target aarch64-linux-android

  ios:
    # iOS 目标的 Rust 部分（iCloud 容器、App Group 走 objc2-foundation）能编译；两个扩展的 Swift 对 iOS SDK 做类型检查。
    # 打 .ipa 要签名和 gen/apple 工程（tauri ios init，要 Apple 开发者账号），不在 CI 里做，见开发说明 §6。
    # macOS 按 10 倍计分钟：只在手动触发、勾了 ios 时跑
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ios
      - name: 占位：前端产物和词典（不打包；手机配置把 resources/dict.db 列为资源，tauri-build 要求文件存在）
        run: mkdir -p apps/desktop/dist apps/desktop/src-tauri/resources && touch apps/desktop/dist/index.html apps/desktop/dist/mobile.html apps/desktop/src-tauri/resources/dict.db
      - name: cargo check（aarch64-apple-ios）
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --target aarch64-apple-ios
      - name: Safari 分享扩展、小组件（Swift）类型检查
        working-directory: apps/desktop/src-tauri/ios-extensions
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          for f in ShareExtension/ShareViewController.swift TibiWidget/TibiWidget.swift; do
            echo "== $f"
            xcrun swiftc -typecheck -parse-as-library -sdk "$SDK" -target arm64-apple-ios17.0-simulator "$f"
          done
