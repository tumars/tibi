# 可选的 CI 发布入口：把已正式发布的 Release 文件传到腾讯云 COS。
# 客户端只访问 dl.ferecord.com；也可在本机运行 pnpm publish:cos，不依赖此工作流。
#   公开域名 https://dl.ferecord.com（CNAME 到腾讯云存储桶，须维护 HTTPS 证书）
#   密钥 CN_S3_ENDPOINT、CN_S3_REGION、CN_S3_BUCKET、CN_S3_ACCESS_KEY_ID、CN_S3_SECRET_ACCESS_KEY
# 手动触发（Actions 页面 → Publish to Tencent COS → Run workflow）可以补传某个 tag。
name: Publish to Tencent COS
on:
  release:
    # 草稿发布时触发；草稿阶段不同步，否则人工检查前用户就会收到更新
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 要同步的 tag（如 v0.1.0）
        required: true

concurrency:
  group: mirror-cn

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      BASE_URL: https://dl.ferecord.com
      BUCKET: ${{ secrets.CN_S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.CN_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CN_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CN_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.CN_S3_REGION }}
      # OSS、COS 不支持新版 AWS CLI 默认加的校验头
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: 检查发布配置
        run: |
          for k in BUCKET S3_ENDPOINT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION; do
            if [ -z "${!k}" ]; then echo "::error::缺少 $k，无法发布到腾讯云"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 下载 Release 文件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$TAG" --dir dist
      - name: 发布到腾讯云并验证公开地址
        run: node tools/publish-cos.mjs release dist "$TAG"
